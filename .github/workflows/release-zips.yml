name: Release ZIPs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-zips-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build WordPress.org and install ZIPs
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Verify release metadata
        run: npm run validate:release

      - name: Build WordPress.org and install packages
        run: npm run build:packages

      - name: Read package version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Plugin version '$VERSION' is not valid SemVer."
            exit 1
          fi

          TAG="v${VERSION}"
          WPORG_ZIP="tarifexa-wordpress-org-${VERSION}.zip"
          INSTALL_ZIP="tarifexa-install-${VERSION}.zip"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "wporg_zip=${WPORG_ZIP}" >> "$GITHUB_OUTPUT"
          echo "install_zip=${INSTALL_ZIP}" >> "$GITHUB_OUTPUT"

          test -f "dist/${WPORG_ZIP}"
          test -f "dist/${INSTALL_ZIP}"
          unzip -l "dist/${WPORG_ZIP}" | grep -q "tarifexa/tarifexa.php"
          unzip -l "dist/${INSTALL_ZIP}" | grep -q "tarifexa/tarifexa.php"
          ! unzip -l "dist/${WPORG_ZIP}" | grep -q "tarifexa/tarifexa/"
          ! unzip -l "dist/${INSTALL_ZIP}" | grep -E "(\.github/|tests/|tools/|docs/|node_modules/)"

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tarifexa-zips-${{ steps.meta.outputs.tag }}
          path: |
            dist/tarifexa-wordpress-org-${{ steps.meta.outputs.version }}.zip
            dist/tarifexa-install-${{ steps.meta.outputs.version }}.zip
            dist/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish semantic GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          WPORG_ZIP: ${{ steps.meta.outputs.wporg_zip }}
          INSTALL_ZIP: ${{ steps.meta.outputs.install_zip }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE="Tarifexa ${TAG}"
          NOTES="$(cat <<EOF
          Automated package build for \`${TAG}\` from \`${BRANCH}\` @ \`${SHA}\`.

          ## Downloads

          | Package | Use |
          | --- | --- |
          | \`${WPORG_ZIP}\` | WordPress.org Plugins Directory / SVN trunk submission |
          | \`${INSTALL_ZIP}\` | Direct install via Plugins → Add New → Upload Plugin |

          Both archives contain a single top-level \`tarifexa/\` directory.

          ## Versioning

          - GitHub tag: \`${TAG}\` (GitHub SemVer convention with \`v\` prefix)
          - Plugin / Stable Tag: \`${VERSION}\` (WordPress.org SVN strips the leading \`v\`)

          This workflow publishes a **prerelease**. It does **not** deploy to WordPress.org SVN.

          When this version is ready for production:

          1. Review the ZIP assets on this release.
          2. Edit the release and uncheck **Set as a pre-release**.
          3. Check **Set as the latest release**.

          That promotion triggers SVN deployment. After a production release exists for \`${TAG}\`, bump the plugin SemVer before the next merge so a new tag such as \`v1.2.1\` can be created.
          EOF
          )"

          publish_prerelease() {
            local release_tag="$1"
            local release_title="$2"

            if gh release view "$release_tag" >/dev/null 2>&1; then
              git tag -f "$release_tag" "$SHA"
              git push -f origin "refs/tags/${release_tag}"
              gh release edit "$release_tag" \
                --title "$release_title" \
                --notes "$NOTES" \
                --prerelease \
                --latest=false
            else
              gh release create "$release_tag" \
                --title "$release_title" \
                --notes "$NOTES" \
                --prerelease \
                --latest=false \
                --target "$SHA"
            fi

            gh release upload "$release_tag" \
              "dist/${WPORG_ZIP}" \
              "dist/${INSTALL_ZIP}" \
              dist/manifest.json \
              --clobber
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_PRERELEASE="$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)"
            if [ "$IS_PRERELEASE" = "false" ]; then
              DEV_TAG="${TAG}-dev"
              echo "Production release ${TAG} already exists. Publishing movable prerelease ${DEV_TAG} instead. Bump the plugin version for the next production tag."
              NOTES="$(cat <<EOF
          Development build after production \`${TAG}\`.

          | Package | Use |
          | --- | --- |
          | \`${WPORG_ZIP}\` | WordPress.org / SVN submission candidate |
          | \`${INSTALL_ZIP}\` | Direct install via Plugins → Add New → Upload Plugin |

          Bump \`tarifexa.php\`, \`readme.txt\` Stable Tag, \`package.json\`, and \`CHANGELOG.md\` to a new SemVer before promoting the next production release.
          EOF
          )"
              publish_prerelease "$DEV_TAG" "Tarifexa ${DEV_TAG}"
              exit 0
            fi
          fi

          publish_prerelease "$TAG" "$TITLE"

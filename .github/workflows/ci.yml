name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "7.4"
          - "8.4"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check PHP syntax
        shell: bash
        run: find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Run calculation and translation tests
        run: npm test

      - name: Regenerate translation catalogs
        run: npm run build:translations

      - name: Verify generated translations are committed
        run: git diff --exit-code -- languages

      - name: Verify release versions match
        run: npm run validate:release

name: Deploy to WordPress.org

on:
  release:
    types:
      - published
      - released

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy release
    if: >-
      github.event.release.prerelease == false
      && startsWith(github.event.release.tag_name, 'v')
      && !contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve WordPress.org VERSION
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Deploying WordPress.org tag ${VERSION} from GitHub tag ${TAG}"

      - name: Deploy to the WordPress.org SVN repository
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: tarifexa
          VERSION: ${{ steps.version.outputs.version }}

      - name: Attach the WordPress.org ZIP to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ZIP_PATH: ${{ steps.deploy.outputs.zip-path }}
        run: gh release upload "$TAG" "$ZIP_PATH" --clobber

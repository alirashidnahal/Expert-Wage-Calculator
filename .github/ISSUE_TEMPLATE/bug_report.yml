name: Bug report
description: Report a reproducible software or calculation defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include personal case data, credentials, or confidential documents.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 1.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: WordPress, PHP, browser, active theme, and relevant plugin versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include calculator mode, tariff year, subject, and anonymized values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Authoritative tariff source
      description: Required for calculation or tariff-data reports.
  - type: textarea
    id: logs
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots if relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I tested the latest release and searched existing issues.
          required: true
        - label: I removed all personal, confidential, and credential data.
          required: true

# Automatically keeps dependencies up to date and secure
version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: "Asia/Tehran"
    assignees:
      - alirashidnahal
    commit-message:
      prefix: github-actions
      include: scope
    labels:
      - dependencies
      - ci-cd
    target-branch: develop
